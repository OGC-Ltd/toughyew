name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  image:
    # Publishes ghcr.io/ogc-ltd/toughyew on main.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Ships the image just published to the server, next to project-manager. The registry
    # login uses this job's own token, which expires when the job ends, so the server keeps
    # no GitHub credential. Uses this repo's production environment secrets
    # (DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY, DEPLOY_KNOWN_HOSTS); until they are set, the
    # job does nothing.
    needs: image
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://toughyew.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - id: ready
        run: |
          if [ -n "$DEPLOY_HOST" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No DEPLOY_HOST secret in the production environment; skipping the deploy."; fi
      - if: steps.ready.outputs.go
        uses: actions/checkout@v4
      - name: SSH key
        if: steps.ready.outputs.go
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts; fi
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Copy compose files
        if: steps.ready.outputs.go
        run: |
          ssh target 'mkdir -p toughyew project-manager/sites'
          scp compose.yaml target:toughyew/
          scp toughyew.caddy target:project-manager/sites/
      - name: Pull and restart
        if: steps.ready.outputs.go
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/ogc-ltd/toughyew:sha-${GITHUB_SHA::7}"
          echo "$TOKEN" | ssh target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh target "set -e; trap 'docker logout ghcr.io >/dev/null' EXIT
            cd ~/toughyew
            touch .env && sed -i '/^IMAGE=/d' .env && echo 'IMAGE=$IMAGE' >> .env
            docker compose pull toughyew
            docker compose up -d --wait --no-build
            cd ~/project-manager && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -af >/dev/null
            cd ~/toughyew && docker compose ps"
