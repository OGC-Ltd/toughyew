<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" preserveAspectRatio="none">
  <!-- Green-and-white paint splash, drawn for the footer's privacy link. Brand greens from tokens.css. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9a5e"/>
      <stop offset="0.5" stop-color="#1e5631"/>
      <stop offset="1" stop-color="#0f3a1f"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd19b"/>
      <stop offset="1" stop-color="#2f7a43"/>
    </linearGradient>
  </defs>
  <!-- brush streaks flying out -->
  <path d="M30 40 C14 30 6 22 2 12 C12 22 22 28 36 32 Z" fill="#2f7a43"/>
  <path d="M206 30 C222 20 230 10 238 4 C232 16 222 28 210 38 Z" fill="#4f9a5e"/>
  <path d="M190 66 C208 74 222 80 236 86 C220 84 204 78 186 72 Z" fill="#1e5631"/>
  <path d="M48 66 C34 76 20 82 6 86 C18 78 32 70 44 60 Z" fill="#4f9a5e"/>
  <!-- main splash body -->
  <path fill="url(#g)" d="M44 26 C58 10 86 16 98 8 C112 0 128 10 142 6 C160 2 168 14 186 16 C204 18 214 30 206 42
    C200 52 214 58 204 68 C192 80 170 72 156 80 C140 88 124 78 108 84 C90 90 78 78 62 80 C44 82 30 72 36 60
    C40 52 26 48 30 40 C34 32 38 32 44 26 Z"/>
  <!-- lighter wash across it -->
  <path fill="url(#l)" opacity="0.55" d="M60 30 C80 20 104 30 126 22 C148 14 170 24 186 30 C170 36 150 34 132 40
    C112 46 92 38 74 44 C62 48 52 40 60 30 Z"/>
  <!-- white highlights -->
  <path fill="#ffffff" opacity="0.35" d="M70 24 C84 18 96 22 108 18 C100 24 86 26 74 30 Z"/>
  <path fill="#ffffff" opacity="0.25" d="M150 66 C164 62 176 66 188 60 C180 68 166 72 152 72 Z"/>
  <!-- droplets -->
  <circle cx="16" cy="56" r="4" fill="#4f9a5e"/>
  <circle cx="8" cy="44" r="2" fill="#ffffff"/>
  <circle cx="26" cy="18" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="60" cy="8" r="3.5" fill="#2f7a43"/>
  <circle cx="122" cy="2.5" r="2" fill="#ffffff"/>
  <circle cx="176" cy="6" r="3" fill="#8fd19b"/>
  <circle cx="222" cy="44" r="4.5" fill="#2f7a43"/>
  <circle cx="232" cy="60" r="2" fill="#ffffff"/>
  <circle cx="214" cy="80" r="2.5" fill="#8fd19b"/>
  <circle cx="130" cy="88" r="2" fill="#4f9a5e"/>
  <circle cx="84" cy="87" r="3" fill="#ffffff" opacity="0.85"/>
  <circle cx="30" cy="84" r="2" fill="#2f7a43"/>
</svg>
